  :root{
    --bg:#050506; --panel-a:#17171b; --panel-b:#0d0d10; --card:#141418; --line:#2a2a30;
    --ink:#f0f0f0; --muted:#8a8a92;
    --red:#ff2a1e; --amber:#ffcf3f; --green:#31b24a; --blue:#2f6bff;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .mono{font-family:"Share Tech Mono","Noto Sans TC",monospace;font-variant-numeric:tabular-nums}
  #app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 16px 14px}

  header{display:flex;align-items:center;gap:8px;padding:12px 0 10px}
  header .title{flex:1;font-size:18px;font-weight:700}
  .topbtn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
  .topbtn:hover{border-color:var(--muted)}
  .topbtn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  .panel{background:linear-gradient(160deg,var(--panel-a),var(--panel-b));border:1px solid #3a3a44;border-radius:20px;padding:16px 20px 14px;box-shadow:0 10px 30px #0009}
  .screen{background:transparent;border:0;padding:0}
  .ptop{display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:6px}
  .fare-label{color:#d6d6d6;font-weight:700;font-size:15px;letter-spacing:.5em;padding-left:.5em;display:inline-flex;align-items:center}
  .fare-label::before,.fare-label::after{content:"";display:inline-block;width:18px;height:2px;background:#5a5a62;margin:0 8px}
  .pico{position:absolute;right:0;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:2px solid #6a6a72;display:flex;align-items:center;justify-content:center;color:#9a9aa2;font-size:13px}
  .pbody{display:flex;align-items:center;gap:14px;min-height:96px}
  .bars{display:flex;flex-direction:column;gap:5px;flex:0 0 auto}
  .bars i{display:block;width:18px;height:5px;border-radius:1px;background:#39391f}
  .bars i.on{background:var(--amber);box-shadow:0 0 8px #ffcf3f88}
  .num{position:relative;flex:1;overflow:hidden;text-align:right}
  .num .digit,.num .ghost{font-family:"DSEG7","Share Tech Mono",monospace;font-size:clamp(54px,18vw,88px);line-height:1;letter-spacing:2px;white-space:nowrap}
  .num .ghost{position:absolute;right:0;top:0;color:#4a1009}
  .num .digit{position:relative;color:var(--red);text-shadow:0 0 16px #ff2a1e88,0 0 3px #ff2a1e}
  .unit{text-align:center;color:#c9c9d0;letter-spacing:.35em;font-size:15px;font-weight:700;margin-top:2px;padding-left:.35em}
  .pfoot{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:10px;padding:0 6px}
  .pfoot .mono{color:#c9c9d0}

  .status{text-align:center;font-size:26px;font-weight:900;color:#fff;margin:16px 0 8px;min-height:32px}
  .status.pause{color:var(--amber)}
  .status.idle{color:var(--muted)}
  .event{text-align:center;color:var(--amber);font-size:13px;min-height:18px;margin-bottom:6px}

  .detail{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:12px;color:var(--muted);margin:0 0 12px;border:1px solid #33333a;border-radius:12px;padding:10px 12px}
  .detail .li{display:flex;justify-content:space-between}
  .detail .li .v{color:#c0c0c8}

  .btnrow{display:flex;gap:8px;margin-bottom:8px}
  .btnrow button{flex:1;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 4px;font:inherit;font-size:14px;cursor:pointer}
  .btnrow button:hover{border-color:var(--muted)}
  .btnrow button:active{transform:translateY(1px)}
  .btnrow button.on{background:var(--amber);color:#1b1b14;border-color:var(--amber);font-weight:700}

  .controls{display:flex;gap:8px}
  .btn{flex:1;appearance:none;border:0;border-radius:12px;padding:16px 0;font:inherit;font-weight:700;font-size:18px;cursor:pointer}
  .btn.start{background:var(--green);color:#04140a}
  .btn.end{background:var(--red);color:#fff}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible,.btnrow button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  .bottombar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
  .bottombar .gps{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  .bottombar .gps.ok{color:var(--green);border-color:#245c2c}
  .bottombar .gps.err{color:var(--red);border-color:#5a1512}

  .simrow{display:none;align-items:center;gap:10px;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .simrow.on{display:flex}
  .simrow input[type=range]{flex:1;accent-color:var(--red)}
  .simrow .sv{font-size:14px;color:var(--red);width:64px;text-align:right}

  .overlay{position:fixed;inset:0;background:#000a;display:none;z-index:20}
  .overlay.open{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;background:var(--panel-a);border-radius:18px 18px 0 0;border:1px solid var(--line);padding:16px 18px calc(20px + env(safe-area-inset-bottom));max-height:84vh;overflow-y:auto;z-index:21;display:none}
  .sheet.open{display:block}
  .sheet h3{font-size:15px;color:var(--amber);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .sub{color:var(--muted);font-size:12px;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.05em}
  .field{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .field label{color:var(--muted);font-size:13px}
  .field input[type=number],.field select{width:130px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 9px;font:inherit;font-size:14px;text-align:right}
  .field input:focus,.field select:focus{outline:1px solid var(--amber);border-color:var(--amber)}
  .switch{position:relative;width:46px;height:26px;flex:0 0 auto}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:var(--line);border-radius:99px;cursor:pointer;transition:.15s}
  .slider::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
  .switch input:checked + .slider{background:var(--red)}
  .switch input:checked + .slider::before{transform:translateX(20px)}
  .mini-seg{display:flex;background:var(--card);border-radius:999px;padding:3px}
  .mini-seg button{appearance:none;border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;font:inherit;font-size:12px;cursor:pointer}
  .mini-seg button[aria-selected="true"]{background:var(--red);color:#fff;font-weight:700}
  .closebtn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  .rateline{color:var(--muted);font-size:11px;margin-top:4px}
  .preset-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .preset-row button{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:12px;cursor:pointer}
  .preset-row button:hover{border-color:var(--amber)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="title">計程車跳表器</span>
    <button class="topbtn" id="btnShare">分享</button>
    <button class="topbtn" id="btnGear">設定</button>
  </header>

  <div class="panel">
    <div class="screen">
      <div class="ptop"><span class="fare-label">FARE</span><span class="pico">8</span></div>
      <div class="pbody">
        <div class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="num"><span class="ghost" id="fareGhost">88.8</span><span class="digit" id="fareNum">85.0</span></div>
      </div>
      <div class="unit" id="unit">NT$</div>
    </div>
    <div class="pfoot">
      <span>起程費 <span class="mono" id="cornerStart">85.0</span></span>
      <span>附加費 <span class="mono" id="cornerSur">0.0</span></span>
    </div>
  </div>

  <div class="status idle" id="status">按「開始」計費</div>
  <div class="event" id="event"></div>

  <div class="detail" id="detail"></div>

  <div class="btnrow">
    <button id="add10">附加 NT$ 10</button>
    <button id="add1">附加 NT$ 1</button>
    <button id="addClr">清空附加</button>
  </div>
  <div class="btnrow">
    <button id="hwy">高速公路（過路費）</button>
  </div>

  <div class="controls">
    <button class="btn start" id="btnStart">開始</button>
    <button class="btn ghost" id="btnPause">暫停</button>
  </div>

  <div class="simrow" id="simRow">
    <span style="color:var(--muted);font-size:13px">模擬車速</span>
    <input type="range" id="speed" min="0" max="90" step="1" value="0">
    <span class="sv mono"><span id="spd">0</span> km/h</span>
  </div>

  <div class="bottombar">
    <span class="mono" id="bDist">0.00km</span>
    <span class="mono" id="bTime">00:00</span>
    <span class="mono" id="bSpeed">0km/h</span>
    <span class="gps" id="gpsBadge">GPS 待命</span>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" aria-label="設定">
  <h3>設定 <button class="closebtn" id="btnClose">關閉</button></h3>
  <div class="sub">地區費率</div>
  <div id="presetRow" class="preset-row"></div>
  <div class="field"><label>時段</label>
    <div class="mini-seg" id="nightSeg">
      <button data-nm="auto" aria-selected="true">自動</button>
      <button data-nm="day">日間</button>
      <button data-nm="night">夜間</button>
    </div>
  </div>
  <div class="sub">費率</div>
  <div id="fareFields"></div>
  <div class="sub">顯示</div>
  <div class="field"><label>顯示幣別</label><select id="dispSel"></select></div>
  <div class="field"><label>基準幣別（計費幣別）</label><select id="baseSel"></select></div>
  <div class="rateline" id="rateLine"></div>
  <div class="sub">距離來源</div>
  <div class="field"><label>來源</label>
    <div class="mini-seg" id="modeSeg">
      <button data-mode="gps" aria-selected="true">GPS</button>
      <button data-mode="sim">模擬</button>
    </div>
  </div>
  <div class="field"><label>提示音效</label>
    <span class="switch"><input type="checkbox" id="soundToggle" checked><span class="slider"></span></span>
  </div>
</div>

(function(){

  var floor=Math.floor,max=Math.max;

  function twDefaults(){return{baseFare:85,baseDistanceKm:1.25,contPrice:5,contPeriodMeters:200,delayPrice:5,delayPeriodSec:60,waitSpeedThresholdKmh:5,nightType:'flat',nightValue:20,highwayPerKm:1.2};}

  var TW_PRESETS=[

    {name:'桃園',baseFare:90,delayPeriodSec:80,nightType:'flat',nightValue:20},

    var costDelay=floor((waitMs/1000)/f.delayPeriodSec)*f.delayPrice;
    return{start:f.baseFare,base:f.baseFare+costCont+costDelay,items:[["起程費",f.baseFare],["續程費",costCont],["延滯費",costDelay]]};

  function loadJSON(k,def){try{var v=LS.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
  var fareTw=Object.assign(twDefaults(),loadJSON("taxi_fare_tw",{}));
  var base=LS.getItem("taxi_base")||"TWD";
  var display=LS.getItem("taxi_display")||"TWD";
  var sound=LS.getItem("taxi_sound")!=="0";
  var mode=LS.getItem("taxi_mode")||"gps";
  var nightMode=LS.getItem("taxi_night")||"auto";
  var rates=loadJSON("taxi_rates",{TWD:1}),ratesTs=+(LS.getItem("taxi_rates_ts")||0),ratesBase=LS.getItem("taxi_rates_base")||"TWD";
  var eng={state:"IDLE",dist:0,runMs:0,waitMs:0,surcharge:0,highwayMeters:0};
  var speed=0,simSpeed=0,watchId=null,lastPos=null,lastItems=null,highwayOn=false;

  function baseCalc(){return twFare(fareTw,eng.dist,eng.waitMs);}
  function isNight(){if(nightMode==="day")return false;if(nightMode==="night")return true;var h=new Date().getHours();return h>=23||h<6;}
  function nightAdd(bc){if(!isNight())return 0;return fareTw.nightType==="percent"?bc.base*fareTw.nightValue:fareTw.nightValue;}
  function tollAdd(){return eng.highwayMeters/1000*fareTw.highwayPerKm;}
  function fullItems(bc){return bc.items.concat([["夜間加成",nightAdd(bc)],["過路費",tollAdd()],["附加費",eng.surcharge]]);}
  function baseTotal(bc){return bc.base+nightAdd(bc)+tollAdd()+eng.surcharge;}

  var $=function(id){return document.getElementById(id);},tick=$("tick");
  function fmtTime(ms){var s=floor(ms/1000),h=floor(s/3600),m=floor((s%3600)/60),ss=s%60;function p(n){return(n<10?"0":"")+n;}return h>0?(p(h)+":"+p(m)+":"+p(ss)):(p(m)+":"+p(ss));}
  function convert(a,code){if(code===base)return a;var rB=rates[base],rC=rates[code];if(rB==null||rC==null)return null;return a/rB*rC;}

  function setBars(){ // 由下往上點亮
    var n=Math.min(5,Math.max(1,Math.round(speed/18)+1)),bs=$("bars").children,L=bs.length;
    for(var i=0;i<L;i++)bs[i].className=(i>=L-n?"on":"");
  }
  function setFareNum(v){var neg=v<0;v=Math.abs(v);var t=(neg?"-":"")+v.toFixed(1);$("fareNum").textContent=t;$("fareGhost").textContent=t.replace(/[0-9]/g,"8");}

  function render(){
    var bc=baseCalc(),bt=baseTotal(bc),items=fullItems(bc);
    var bi=curInfo(base),conv=convert(bt,display),ci=curInfo(display);
    setFareNum(conv==null?bt:conv);
    $("unit").textContent=(conv==null)?bi[1]:ci[1];
    $("cornerStart").textContent=fmtMoney(bc.start,base);
    $("cornerSur").textContent=fmtMoney(eng.surcharge,base);
    $("bDist").textContent=(eng.dist/1000).toFixed(2)+"km";
    $("bTime").textContent=fmtTime(eng.runMs);
    $("bSpeed").textContent=Math.round(speed)+"km/h";
    setBars();
    var g="";for(var i=0;i<items.length;i++)g+='<div class="li"><span>'+items[i][0]+'</span><span class="v mono">'+fmtMoney(items[i][1],base)+'</span></div>';
    $("detail").innerHTML=g;
    var st=$("status"),night=isNight()?" · 夜間":"";
    if(eng.state==="RUNNING"){st.textContent="計費中"+night;st.className="status";}
    else if(eng.state==="PAUSED"){st.textContent="已暫停"+night;st.className="status pause";}
    else{st.textContent="按「開始」計費"+(night?"（夜間）":"");st.className="status idle";}
    $("btnStart").textContent=(eng.state==="IDLE")?"開始":"結束";
    $("btnStart").className="btn "+((eng.state==="IDLE")?"start":"end");
    $("btnPause").textContent=(eng.state==="PAUSED")?"繼續":"暫停";
    $("hwy").className=highwayOn?"on":"";
    $("hwy").textContent=highwayOn?("高速公路 ✓ 過路費 "+fmtMoney(tollAdd(),base)):"高速公路（過路費）";
    if(display!==base&&conv!=null)$("event").textContent="≈ 基準 "+bi[1]+" "+fmtMoney(bt,base);
  }

  function setEvent(t){$("event").textContent=t;}
  function playTick(){if(sound){try{tick.currentTime=0;tick.play();}catch(e){}}}
  function detectEvents(){
    var items=fullItems(baseCalc());
    if(lastItems){for(var i=0;i<items.length;i++){var prev=lastItems[i]?lastItems[i][1]:0,d=items[i][1]-prev;if(d>0.0001){setEvent(items[i][0]+" +"+fmtMoney(d,base)+"元");playTick();}}}
    lastItems=items.map(function(x){return [x[0],x[1]];});
  }

  setInterval(function(){
    if(eng.state!=="RUNNING")return;
    if(mode==="sim"){speed=simSpeed;var dd=speed*1000/3600;if(dd>0){eng.dist+=dd;if(highwayOn)eng.highwayMeters+=dd;}}
    eng.runMs+=1000;
    if(speed<fareTw.waitSpeedThresholdKmh)eng.waitMs+=1000;
    detectEvents();render();
  },1000);

  function haversine(a,b){var R=6371000,t=Math.PI/180,dLat=(b.lat-a.lat)*t,dLon=(b.lng-a.lng)*t,la1=a.lat*t,la2=b.lat*t;var h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
  function setBadge(t,cls){var b=$("gpsBadge");b.textContent=t;b.className="gps"+(cls?(" "+cls):"");}
  function startGps(){if(mode!=="gps"||!navigator.geolocation||watchId!=null)return;setBadge("定位中…","");
    watchId=navigator.geolocation.watchPosition(function(p){setBadge("GPS","ok");var c=p.coords,cur={lat:c.latitude,lng:c.longitude,t:p.timestamp};
      if(c.accuracy&&c.accuracy>30){lastPos=cur;return;}
      var sp=(c.speed!=null&&c.speed>=0)?c.speed*3.6:0;
      if(lastPos){var dt=(cur.t-lastPos.t)/1000,dm=haversine(lastPos,cur);if((c.speed==null||c.speed<0)&&dt>0)sp=dm/dt*3.6;if(eng.state==="RUNNING"&&dm>0){eng.dist+=dm;if(highwayOn)eng.highwayMeters+=dm;}}
      speed=sp;lastPos=cur;detectEvents();render();
    },function(){setBadge("GPS 無法使用","err");},{enableHighAccuracy:true,maximumAge:1000,timeout:15000});}
  function stopGps(){if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;}lastPos=null;}

  function updateRateLine(){if(!ratesTs){$("rateLine").textContent="尚未取得匯率";return;}var m=floor((Date.now()-ratesTs)/60000),w=m<1?"剛剛":(m<60?m+" 分鐘前":floor(m/60)+" 小時前");$("rateLine").textContent="匯率更新："+w+"（基準 "+ratesBase+"）";}
  function parseFawaz(j,b){b=b.toLowerCase();if(!j[b])return null;var o={},m=j[b];for(var k in m)o[k.toUpperCase()]=m[k];return Object.keys(o).length?o:null;}
  function parseErApi(j){if(!j.rates)return null;var o={};for(var k in j.rates)o[k.toUpperCase()]=j.rates[k];return Object.keys(o).length?o:null;}
  function fetchJson(u){return fetch(u,{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json();});}
  function refreshRates(){var b=base;$("rateLine").textContent="更新匯率中…";
    var urls=[["https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/"+b.toLowerCase()+".json","f"],["https://latest.currency-api.pages.dev/v1/currencies/"+b.toLowerCase()+".json","f"],["https://open.er-api.com/v6/latest/"+b,"e"]];
    (function tryNext(i){if(i>=urls.length){updateRateLine();return;}fetchJson(urls[i][0]).then(function(j){var m=urls[i][1]==="f"?parseFawaz(j,b):parseErApi(j);if(!m)throw 0;m[b]=1;rates=m;ratesTs=Date.now();ratesBase=b;LS.setItem("taxi_rates",JSON.stringify(rates));LS.setItem("taxi_rates_ts",""+ratesTs);LS.setItem("taxi_rates_base",b);updateRateLine();render();}).catch(function(){tryNext(i+1);});})(0);}

  // 螢幕常亮(Wake Lock),計費中不熄屏
  var wakeLock=null;
  function acquireWake(){try{if('wakeLock' in navigator)navigator.wakeLock.request('screen').then(function(w){wakeLock=w;}).catch(function(){});}catch(e){}}
  function releaseWake(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&eng.state==="RUNNING")acquireWake();});

  $("btnStart").onclick=function(){
    if(eng.state==="IDLE"){eng.state="RUNNING";lastItems=null;playTick();detectEvents();acquireWake();}
    else{eng={state:"IDLE",dist:0,runMs:0,waitMs:0,surcharge:0,highwayMeters:0};highwayOn=false;lastItems=null;releaseWake();}
    render();
  };
  $("btnPause").onclick=function(){if(eng.state==="RUNNING")eng.state="PAUSED";else if(eng.state==="PAUSED")eng.state="RUNNING";render();};
  function addSur(a){eng.surcharge+=a;setEvent("附加費 +"+fmtMoney(a,base)+"元");playTick();lastItems=null;detectEvents();render();}
  $("add10").onclick=function(){addSur(10);};
  $("add1").onclick=function(){addSur(1);};
  $("addClr").onclick=function(){eng.surcharge=0;setEvent("附加費已清空");lastItems=null;detectEvents();render();};
  $("hwy").onclick=function(){highwayOn=!highwayOn;setEvent(highwayOn?"已開始計過路費(1.2元/公里)":"已停止計過路費");render();};
  $("btnShare").onclick=function(){var url=location.href;if(navigator.share){navigator.share({title:"計程車跳表器",url:url}).catch(function(){});}else if(navigator.clipboard){navigator.clipboard.writeText(url);setEvent("已複製網址");}};

  function selectMode(m){mode=m;LS.setItem("taxi_mode",m);document.querySelectorAll('#modeSeg [data-mode]').forEach(function(t){t.setAttribute("aria-selected",t.dataset.mode===m?"true":"false");});$("simRow").classList.toggle("on",m==="sim");if(m==="gps"){startGps();}else{stopGps();setBadge("模擬","");speed=simSpeed;}render();}
  document.querySelectorAll('#modeSeg [data-mode]').forEach(function(t){t.onclick=function(){selectMode(t.dataset.mode);};});
  $("speed").oninput=function(){simSpeed=+this.value;$("spd").textContent=simSpeed;if(mode==="sim"){speed=simSpeed;render();}};
  function selectNight(nm){nightMode=nm;LS.setItem("taxi_night",nm);document.querySelectorAll('#nightSeg [data-nm]').forEach(function(t){t.setAttribute("aria-selected",t.dataset.nm===nm?"true":"false");});render();}
  document.querySelectorAll('#nightSeg [data-nm]').forEach(function(t){t.onclick=function(){selectNight(t.dataset.nm);};});

  function buildPresets(){var h="";for(var i=0;i<TW_PRESETS.length;i++)h+='<button data-i="'+i+'">'+TW_PRESETS[i].name+'</button>';$("presetRow").innerHTML=h;
    $("presetRow").querySelectorAll("button").forEach(function(b){b.onclick=function(){applyPreset(TW_PRESETS[+b.dataset.i]);};});}
  function applyPreset(p){fareTw=Object.assign(twDefaults(),p);delete fareTw.name;LS.setItem("taxi_fare_tw",JSON.stringify(fareTw));buildFields();render();}
  function buildFields(){var h="";for(var i=0;i<TW_FIELDS.length;i++){var k=TW_FIELDS[i][0];h+='<div class="field"><label>'+TW_FIELDS[i][1]+'</label><input type="number" step="0.1" data-k="'+k+'" value="'+fareTw[k]+'"></div>';}$("fareFields").innerHTML=h;$("fareFields").querySelectorAll("input").forEach(function(inp){inp.onchange=function(){var v=parseFloat(this.value);if(!isNaN(v)){fareTw[this.dataset.k]=v;LS.setItem("taxi_fare_tw",JSON.stringify(fareTw));render();}};});}
  function buildSel(sel,val){var h="";for(var i=0;i<CURRENCIES.length;i++){var c=CURRENCIES[i];h+='<option value="'+c[0]+'"'+(c[0]===val?" selected":"")+'>'+c[2]+' ('+c[0]+')</option>';}sel.innerHTML=h;}
  function openSheet(o){$("overlay").classList.toggle("open",o);$("sheet").classList.toggle("open",o);}
  $("btnGear").onclick=function(){openSheet(true);};$("btnClose").onclick=function(){openSheet(false);};$("overlay").onclick=function(){openSheet(false);};
  $("soundToggle").onchange=function(){sound=this.checked;LS.setItem("taxi_sound",sound?"1":"0");};
  $("dispSel").onchange=function(){display=this.value;LS.setItem("taxi_display",display);render();};
  $("baseSel").onchange=function(){base=this.value;LS.setItem("taxi_base",base);refreshRates();render();};

  buildSel($("dispSel"),display);buildSel($("baseSel"),base);$("soundToggle").checked=sound;buildPresets();buildFields();selectMode(mode);selectNight(nightMode);
  updateRateLine();if(!ratesTs||Date.now()-ratesTs>3600000)refreshRates();else render();

  if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
})();
</script>
</body>
</html>
